<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>題解 — LeetCode Notes</title>
  <meta name="description" content="按題型和難度快速查找 LeetCode 題解，支援多種解法切換。">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <a class="nav-brand" href="index.html">
    <div class="nav-logo">⚡</div>
    <span>LC Notes</span>
  </a>
  <ul class="nav-links" id="navLinks">
    <li><a class="nav-link" href="index.html">🏠 主頁</a></li>
    <li><a class="nav-link active" href="solutions.html">💻 題解</a></li>
    <li><a class="nav-link" href="notes.html">📝 筆記</a></li>
  </ul>
  <div class="nav-spacer"></div>
  <button class="btn btn-ghost" id="sidebarToggleBtn" style="font-size:.8rem;padding:6px 12px;display:none">☰ 題目</button>
  <a href="https://github.com/AImasterArc/leetcode-note" target="_blank" class="btn btn-ghost" style="font-size:.8rem;padding:6px 12px">⭐ GitHub</a>
  <button class="hamburger" id="hamburger" aria-label="選單"><span></span><span></span><span></span></button>
</nav>

<div class="sidebar-layout">

  <!-- Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <input class="sidebar-search" id="probSearch" type="search" placeholder="🔍 搜尋題號或題名...">
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <div style="padding:20px;color:var(--txt2);font-size:.875rem;text-align:center">載入中...</div>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main-content" id="mainContent">
    <div class="placeholder">
      <div class="placeholder-icon">💻</div>
      <div style="font-size:1.1rem;font-weight:600">選擇一道題目</div>
      <div style="font-size:.875rem;color:var(--txt2)">從左側選單點選題型和題目</div>
    </div>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="assets/js/solutions.js"></script>
<script>
  const hamburger = document.getElementById('hamburger');
  const navLinks  = document.getElementById('navLinks');
  const toggleBtn = document.getElementById('sidebarToggleBtn');
  const sidebar   = document.getElementById('sidebar');
  const overlay   = document.getElementById('sidebarOverlay');

  hamburger.addEventListener('click', () => navLinks.classList.toggle('open'));

  function openSidebar()  { sidebar.classList.add('open'); overlay.classList.add('open'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

  toggleBtn.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
  overlay.addEventListener('click', closeSidebar);

  // Show toggle btn on mobile
  function checkMobile() {
    toggleBtn.style.display = window.innerWidth <= 768 ? 'flex' : 'none';
  }
  checkMobile();
  window.addEventListener('resize', checkMobile);
</script>
</body>
</html>
